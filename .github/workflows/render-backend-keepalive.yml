name: Render Backend Keepalive

on:
  schedule:
    # Keep the free Render instance warm; scheduled GitHub jobs can start late,
    # so use a 5-minute cadence rather than waiting close to Render's sleep window.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: render-backend-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping lightweight backend health endpoint
        env:
          BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
        run: |
          URL="${BACKEND_HEALTH_URL:-https://student-skill-tracker-backend.onrender.com/api/ping}"
          echo "Pinging ${URL}"
          curl --silent --show-error --fail --max-time 120 --retry 3 --retry-all-errors --retry-delay 5 "${URL}"
